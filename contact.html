<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with me for front-end development contracts, consulting, or project collaborations.">
  <meta name="keywords" content="Contact developer, hire frontend developer, software consulting, build website">
  <title>Contact Me | Frontend Developer</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="page-container">
    <!-- Header -->
    <header>
      <a href="index.html" class="logo-container" id="logo-link">
        <div class="logo-icon"></div>
        <span>your name</span>
      </a>
      <div class="header-actions">
        <nav class="nav-links" aria-label="Main Navigation">
          <a href="index.html" id="nav-home">Home</a> /
          <a href="projects.html" id="nav-projects">Projects</a> /
          <a href="articles.html" id="nav-articles">Articles</a> /
          <a href="contact.html" class="active" id="nav-contact">Contact</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="theme-toggle-icon sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-toggle-icon moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Content Section -->
    <main class="content-wrapper">
      <h2 style="text-align: center; margin-bottom: 10px;">Get in Touch</h2>
      <p style="text-align: center; margin-bottom: 30px; font-size: 1.1rem; color: var(--color-text-muted);">
        Have a project idea, question, or just want to say hello? Drop a message below!
      </p>

      <!-- Contact Form -->
      <div class="form-container">
        <form action="#" method="POST" id="contact-form">
          <div class="form-group">
            <label for="contact-name" class="form-label">Full Name</label>
            <input type="text" id="contact-name" name="name" class="form-input" placeholder="Jane Doe" required>
          </div>

          <div class="form-group">
            <label for="contact-email" class="form-label">Email Address</label>
            <input type="email" id="contact-email" name="email" class="form-input" placeholder="jane@example.com" required>
          </div>

          <div class="form-group">
            <label for="contact-subject" class="form-label">Subject</label>
            <input type="text" id="contact-subject" name="subject" class="form-input" placeholder="Project Collaboration Inquiry" required>
          </div>

          <div class="form-group">
            <label for="contact-message" class="form-label">Message</label>
            <textarea id="contact-message" name="message" class="form-input form-textarea" placeholder="Describe your project, ideas, or requirements..." required></textarea>
          </div>

          <button type="submit" class="form-submit-btn" id="contact-submit">Send Message</button>
        </form>
      </div>
    </main>

    <!-- Single Separator Line -->
    <hr class="single-hr">

    <!-- Footer -->
    <footer>
      <p>&copy; all rights reserved 2025</p>
    </footer>
  <script src="theme.js"></script>
</body>
</html>
